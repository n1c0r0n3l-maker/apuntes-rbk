        <main>
            <section id="registro" class="registro">
                <h2>Resgitro</h2>

                <form
                    id="registro-form"
                    action="php/procesar_registro.php"
                    method="post"

                >
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input 
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Nombre*"
                            required
                            minlength="3"
                            title="El nombre debe tener al menos 3 caracteres."
                        />
                    </div>

                    <div class="form-group">
                        <label for="apellido">Apellido:</label>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Apellido*"
                            required
                            minlength="3"
                            title="El apellido debe tener al menos 3 caracteres."
                        />
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Dirección de email*"
                            max="100"
                            required
                            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                            title="Introduzca una dirección de correo electrónico válida."
                        />
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Contraseña*"
                            required
                            minlength="8"
                            title="La contraseña debe tener al menos 8 caracteres."
                        />
                    </div>

                    <div class="form-group">
                        <label for="confirmation">Repetir contraseña:</label>
                        
                        <input
                            type="password"
                            id="confirmation"
                            name="confirmation"
                            placeholder="Repetir contraseña*"
                            required
                            minlength="8"
                            title="Las contraseñas deben coincidir."
                        />
                    </div>

                    <div class="form-group">
                        <label for="edad">Edad:</label>
                
                        <input
                            type="number"
                            id="edad"
                            name="edad"
                            placeholder="Edad*"
                            min="17"
                            max="100"required
                            title="Introduce una edad válida."
                        />
                    </div>

                    <button type="submit">Registrarme</button>
                </form>
            </section>
        </main>
